# Alembic's entry point for the command line. The application does not read it:
# `db/migrate.py` builds an equivalent Config in process, so a migration runs
# the same way whether it was started by `alembic upgrade head` or by the app.
#
# `sqlalchemy.url` is deliberately empty. The database location is a setting
# (`DATABASE_URL`), and a second copy of it here is a second thing to keep in
# step - `env.py` reads it from `ainews.config` instead.

[alembic]
script_location = src/ainews/db/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
