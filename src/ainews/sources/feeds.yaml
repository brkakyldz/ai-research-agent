# Seed feed list. Loaded into the `sources` table on first start and re-synced on
# every start: new entries are inserted, removed entries are left alone (a feed
# you deleted here but already collected from keeps its articles). Everything an
# operator changes afterwards - enabled, weight - lives in the database and in
# the /sources page, and is never overwritten from this file.
#
# `weight` (0.5-2.0) does two jobs: it breaks ranking ties, and it decides which
# items are worth spending a Tavily credit on. Primary sources - the lab that did
# the thing - outrank commentary about it.
#
# No arXiv, deliberately (PLAN.md): ~300 items/day would dominate ranking, and
# the papers that matter reach the digest through Hacker News, Hugging Face and
# Simon Willison anyway.
#
# Verified live on 2026-09-04; see reports/research/2026-09-04_ai-news-newsletter-agent.md.

- name: OpenAI
  url: https://openai.com/news/rss.xml
  weight: 2.0

- name: Google DeepMind
  url: https://deepmind.google/blog/rss.xml
  weight: 2.0

