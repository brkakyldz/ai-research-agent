services:
  app:
    build: .
    image: ai-research-agent:latest
    container_name: ainews
    restart: unless-stopped
    # Secrets come from the local dotenv file; copy the template first.
    env_file:
      - .env
    environment:
      # Inside the container the database always lives on the mounted volume,
      # whatever the host environment file says.
      DATABASE_URL: sqlite+aiosqlite:///./data/app.db
    ports:
      - "8000:8000"
    volumes:
      # A named volume, not a bind mount to ./data. WAL needs a shared-memory
      # file beside the database, and a Windows host directory mounted into a
      # Linux container cannot provide one: `PRAGMA journal_mode=WAL` fails with
      # "disk I/O error" and the app never starts. ADR 0007.
      # To read the database from the host: docker cp ainews:/app/data/app.db .
      - ainews-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ainews-data:
